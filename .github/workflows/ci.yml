name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall rehyra codex-plugin benchmarks/tasks tests

  science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements/repro-science.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build and install wheel outside the checkout
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/rehyra-wheel-venv"
          "$RUNNER_TEMP/rehyra-wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/wheels/rehyra-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rehyra-wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
          "$RUNNER_TEMP/rehyra-wheel-venv/bin/rehyra" --help
