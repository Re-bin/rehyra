[run]
name = "adderboard-codex-rehyra-pilot"
task_spec = "../../task-data/adderboard/task.json"
max_proposals = 4
max_concurrency = 2
queue_target = 2
context_batch_size = 2

[agent]
backend = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_timeout_seconds = 900
proposal_timeout_seconds = 1800

