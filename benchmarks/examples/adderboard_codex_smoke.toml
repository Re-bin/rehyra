[run]
name = "adderboard-codex-rehyra-smoke"
task_spec = "../../task-data/adderboard/task.json"
max_proposals = 1
max_concurrency = 1
queue_target = 1
context_batch_size = 1

[agent]
backend = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_timeout_seconds = 900
proposal_timeout_seconds = 1200

